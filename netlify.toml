  status = 200
  force = true

[[headers]]
  for = "/stats"
  [headers.values]
    Cache-Control = "no-store"

# HTML is revalidated so a new deploy cannot leave visitors on an old page shell.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ai-security"
  [headers.values]
    Cache-Control = "no-cache"

