[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/products/**"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/snapshot/**"
  [headers.values]
    Cache-Control = "public, max-age=3600"

