    :root {
      --bg-abyss: #08090a;
      --bg-surface: #101012;
      --bg-elevated: #191a1b;
      --bg-hover: #222324;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99,102,241,0.15);
      --gold: #f59e0b;
      --text: #e7e7e7;
      --text-dim: #9ca3af;
      --border: #26272b;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'DM Sans', 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-abyss);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, var(--accent-glow), transparent 60%);
      pointer-events: none;
    }
    .check {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent-glow);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
      color: var(--accent-hover);
    }
    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--text-dim);
      max-width: 34rem;
      margin: 0 auto 2rem;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-block;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost {
      border-color: var(--border);
      color: var(--text);
    }
    .btn-ghost:hover { background: var(--bg-hover); }
    .note {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: var(--text-dim);
      max-width: 30rem;
    }
  </style>
