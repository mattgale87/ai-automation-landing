<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2560, height=1440">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 2560px;
  height: 1440px;
  background: #08090a;
  overflow: hidden;
  position: relative;
  font-family: 'Inter', sans-serif;
}

/* Background grid pattern */
.grid-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image:
    linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* Circuit lines */
.circuit {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

.circuit-line {
  position: absolute;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.15), transparent);
  height: 1px;
}

.circuit-line-v {
  position: absolute;
  background: linear-gradient(180deg, transparent, rgba(0,212,255,0.15), transparent);
  width: 1px;
}

/* Neural network nodes */
.node {
  position: absolute;
  width: 4px; height: 4px;
  background: rgba(0,212,255,0.3);
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(0,212,255,0.2);
}

/* Red accent lines */
.accent-line {
  position: absolute;
  background: linear-gradient(90deg, transparent, rgba(255,68,68,0.2), transparent);
  height: 2px;
}

/* Main content - centered */
.content {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 10;
}

.logo-text {
  font-size: 180px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -4px;
  line-height: 1;
  text-shadow: 0 0 60px rgba(0,212,255,0.3);
}

.subtitle {
  font-size: 72px;
  font-weight: 300;
  color: #00D4FF;
  letter-spacing: 12px;
  text-transform: uppercase;
  margin-top: 16px;
}

.tagline {
  font-size: 28px;
  font-weight: 400;
  color: rgba(255,255,255,0.4);
  margin-top: 40px;
  letter-spacing: 2px;
}

/* Decorative elements */
.hex-ring {
  position: absolute;
  border: 1px solid rgba(0,212,255,0.08);
  border-radius: 50%;
}

.hex-ring-1 {
  width: 500px; height: 500px;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

.hex-ring-2 {
  width: 800px; height: 800px;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

.hex-ring-3 {
  width: 1100px; height: 1100px;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<div class="grid-bg"></div>

<!-- Neural network nodes -->
<div class="node" style="top:15%;left:10%"></div>
<div class="node" style="top:25%;left:15%"></div>
<div class="node" style="top:75%;left:85%"></div>
<div class="node" style="top:80%;left:90%"></div>
<div class="node" style="top:45%;left:8%"></div>
<div class="node" style="top:60%;left:92%"></div>
<div class="node" style="top:35%;left:88%"></div>
<div class="node" style="top:70%;left:12%"></div>
<div class="node" style="top:20%;left:50%"></div>
<div class="node" style="top:85%;left:45%"></div>

<!-- Circuit lines -->
<div class="circuit-line" style="top:30%;left:0;width:40%"></div>
<div class="circuit-line" style="top:70%;left:60%;width:40%"></div>
<div class="circuit-line-v" style="top:0;left:25%;height:50%"></div>
<div class="circuit-line-v" style="top:50%;left:75%;height:50%"></div>

<!-- Red accent lines -->
<div class="accent-line" style="top:42%;left:5%;width:20%"></div>
<div class="accent-line" style="top:58%;left:75%;width:20%"></div>

<!-- Hex rings -->
<div class="hex-ring hex-ring-1"></div>
<div class="hex-ring hex-ring-2"></div>
<div class="hex-ring hex-ring-3"></div>

<!-- Main content -->
<div class="content">
  <div class="logo-text">GALE</div>
  <div class="subtitle">TECH</div>
  <div class="tagline">AI Security • Enterprise IT • Honest Tech Analysis</div>
</div>
  <!-- GaleOps first-party counter -->
  <script src="/assets/galeops-counter.js" defer></script>
</body>
</html>
